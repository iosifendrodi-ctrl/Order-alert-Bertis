{% extends "base.html" %}{% block content %}<div class="wrap"><h1>Configurare</h1><div class="panel"><h2>Reguli globale</h2><form method="post"><label>Prag alertă (%) <input class="input" name="alert_threshold" value="{{alert_threshold}}"></label> <label>Prag critic (%) <input class="input" name="critical_threshold" value="{{critical_threshold}}"></label> <label><input type="checkbox" name="zero_alert" value="1" {% if zero_alert=='1' %}checked{% endif %}> Alertă la cantitate 0</label> <button class="btn">Salvează</button></form></div>
<div class="panel"><h2>Produse</h2><table class="table"><tr><th>SKU</th><th>Produs</th><th>Unitate</th><th>Prag individual</th><th>Critic</th><th></th></tr>{% for p in products %}<tr><form method="post" action="/product/{{p.sku}}"><td>{{p.sku}}</td><td>{{p.name}}</td><td>{{p.unit}}</td><td><input class="input" name="threshold" value="{{p.threshold or ''}}" placeholder="global"></td><td><input type="checkbox" name="critical" value="1" {% if p.critical %}checked{% endif %}></td><td><button class="btn">Salvează</button></td></form></tr>{% endfor %}</table></div></div>{% endblock %}
